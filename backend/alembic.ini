# Alembic config for WebinarFlow-AI.
# The migrations script_location points at the package directory; the actual
# database URL is read from app.core.config in env.py (not from here) so a
# single .env source of truth is used.
[alembic]
script_location = app/migrations
prepend_sys_path = .
version_path_separator = os

[post_write_hooks]

# Logging!
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
